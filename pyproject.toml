[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "outline-labeler"
version = "0.1.0"
description = "Label images for segmentation in your web browser: click automatic outlines, brush, polygon, Segment Anything."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Joshua Atolagbe"}]

dependencies = ["numpy>=1.21", "pillow>=9", "scikit-image>=0.19", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/joshua-atolagbe/outline-labeler"

[project.optional-dependencies]
tiff = ["tifffile"]
sam = ["torch", "segment-anything"]

[project.scripts]
outline-labeler = "outline_labeler.cli:main"

[tool.setuptools]
packages = ["outline_labeler"]

[tool.setuptools.package-data]
outline_labeler = ["static/*"]
